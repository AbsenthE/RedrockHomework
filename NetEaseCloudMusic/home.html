<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="js.js"></script>
    <!-- 左侧导航 -->

    <div class="leftNavigation">
        <div class="leftGreyBar">
            <a href="/NetEaseCloudMusic/home.html" class="logo">
                <img src="image/NClogo.png" alt="网易云音乐">
            </a>
            <ul class="menu">
                <li>推荐</li>
                <li>精选</li>
            </ul>
            <img src="image/divider.png">
            <ul class="iLike">
                <li>我的收藏</li>
            </ul>
        </div>

        <!-- 右侧 -->
        <div>
            <div class="recommended">
                <img src="image/recommended.png">
            </div>
            <div class="recommendedPlaylists">
                <a href="playlist.html" class="playlist">
                    <img src="image/a.jpg">
                    <p>播放 22630</p>
                    <strong>热播金曲</strong>
                </a>
                <a href="playlist.html" class="playlist">
                    <img src="image/b.jpg">
                    <p>播放 12139</p>
                    <strong>日语精选</strong>
                </a>
                <a href="playlist.html" class="playlist">
                    <img src="image/c.jpg">
                    <p>播放21134</p>
                    <strong>英文精选</strong>
                </a>
                <a href="playlist.html" class="playlist">
                    <img src="image/d.jpg">
                    <p>播放33150</p>
                    <strong>海鲜市场</strong>
                </a>
                <a href="playlist.html" class="playlist">
                    <img src="image/e.jpg">
                    <p>播放23112</p>
                    <strong>初音未来精选</strong>
                </a>
            </div>

            <!-- 轮播图 -->
            <div class="activities">
                <img src="image/activities.png">
            </div>
            <div class="autoPlayPicture">
                <div class="turnLeft" id="turnLeftButton">&lt;</div>
                <div class="turnRight" id="turnRightButton">&gt;</div>
                <div class="autoPlayList" id="autoPlayListID">
                    <a href="#" class="show"><img src="image/two.png"></a>
                    <a href="#"><img src="image/one.png"></a>
                </div>
            </div>

        </div>

    </div>








</body>

</html>
